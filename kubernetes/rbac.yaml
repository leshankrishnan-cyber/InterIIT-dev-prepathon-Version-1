apiVersion: v1
kind: ServiceAccount
metadata:
  name: rca-agent-sa
  namespace: rca
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rca-read-only-role
  namespace: rca
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "pods/log", "events", "deployments", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rca-read-only-binding
  namespace: rca
subjects:
  - kind: ServiceAccount
    name: rca-agent-sa
    namespace: rca
roleRef:
  kind: Role
  name: rca-read-only-role
  apiGroup: rbac.authorization.k8s.io